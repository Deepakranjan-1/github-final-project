<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Final Project - Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator-card">
            <h1>Simple Interest Calculator</h1>
            <p class="subtitle">Calculate your investment returns with precision</p>
            
            <form id="calculator-form">
                <div class="input-group">
                    <label for="principal">Principal Amount ($)</label>
                    <input type="number" id="principal" placeholder="Enter principal amount" step="0.01" required>
                </div>
                
                <div class="input-group">
                    <label for="rate">Interest Rate (%)</label>
                    <input type="number" id="rate" placeholder="Enter interest rate" step="0.01" required>
                </div>
                
                <div class="input-group">
                    <label for="time">Time Period (Years)</label>
                    <input type="number" id="time" placeholder="Enter time in years" step="0.1" required>
                </div>
                
                <button type="submit" class="calculate-btn">Calculate Interest</button>
            </form>
            
            <div id="results" class="results-section">
                <div class="result-item">
                    <span class="result-label">Simple Interest:</span>
                    <span id="simple-interest" class="result-value">$0.00</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Total Amount:</span>
                    <span id="total-amount" class="result-value">$0.00</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
